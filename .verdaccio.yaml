#
# This is the default config file. It allows all users to do anything,
# so don't use it on production systems.
#
# Look here for more config file examples:
# https://github.com/verdaccio/verdaccio/tree/master/conf
#

# path to a directory with all packages
storage: ./.verdaccio

# Loopback only (also Verdaccio's default). `localhost`, not 127.0.0.1, so it binds to the same
# address clients resolve for http://localhost:4873, whether that is IPv4 or IPv6.
listen: localhost:4873

# path to a directory with plugins to include
plugins: ./plugins

web:
  # WebUI is enabled as default, if you want disable it, just uncomment this line
  #enable: false
  title: Verdaccio

auth:
  htpasswd:
    file: ./htpasswd
    # Only one user can register: the one that publishes (CI registers `webiny-bot`, see
    # .github/workflows/wac/steps/createVerdaccioAuthSteps.ts). Nobody can register a second
    # user to publish with.
    max_users: 1

# a list of other known repositories we can talk to
uplinks:
  npmjs:
    url: https://registry.npmjs.org/

# Anyone can install; only the registered user can publish. The first matching block wins.
packages:
  # External @webiny packages that are not in this repository: install them from npm.
  "@webiny/di":
    access: $all
    publish: $authenticated
    proxy: npmjs

  "@webiny/stdlib":
    access: $all
    publish: $authenticated
    proxy: npmjs

  "@webiny/wts-client":
    access: $all
    publish: $authenticated
    proxy: npmjs

  # Packages built from this repository: never fall back to npm, so a package missing from the
  # local release fails the install instead of silently testing a published version.
  "@webiny/*":
    access: $all
    publish: $authenticated

  "create-webiny-project":
    access: $all
    publish: $authenticated

  "@*/*":
    # scoped packages
    access: $all
    publish: $authenticated
    proxy: npmjs

  "**":
    access: $all
    publish: $authenticated
    proxy: npmjs

# You can specify HTTP/1.1 server keep alive timeout in seconds for incomming connections.
# A value of 0 makes the http server behave similarly to Node.js versions prior to 8.0.0, which did not have a keep-alive timeout.
# WORKAROUND: Through given configuration you can workaround following issue https://github.com/verdaccio/verdaccio/issues/301. Set to 0 in case 60 is not enought.
server:
  keepAliveTimeout: 60

# To use `npm audit` uncomment the following section
middlewares:
  audit:
    enabled: true

logs:
  - { type: stdout, format: pretty, level: http }

max_body_size: 1000mb

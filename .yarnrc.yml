approvedGitRepositories:
  - "https://github.com/webiny/webiny-upgrades-v6"

compressionLevel: mixed

enableGlobalCache: true

enableScripts: false

nodeLinker: node-modules

# Hard-link files in node_modules from one store shared by every clone (~/.yarn/berry/store)
# instead of copying them into each one.
nmMode: hardlinks-global

npmMinimalAgeGate: 3d

npmPreapprovedPackages:
  - "@webiny/di"
  - "@webiny/stdlib"
  - "@webiny/wts-client"
  - wts-client

yarnPath: .yarn/releases/yarn-4.18.1.cjs

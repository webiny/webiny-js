# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    enabled: true
    # Review PRs into any base branch, not only the default one, so PRs
    # stacked on a feature branch get reviewed too.
    base_branches:
      - ".*"
    # PRs opened by these users are not auto-reviewed. A review can still
    # be requested on such a PR with `@coderabbitai review`.
    ignore_usernames:
      - "adrians5j"
      - "Pavel910"

name: Pull Requests Command - Alpha Release
'on': issue_comment
concurrency:
  group: alpha-release-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  checkComment:
    name: Check comment for /alpha
    if: >-
      ${{ github.event.issue.pull_request && (github.event.comment.body ==
      '/alpha' || startsWith(github.event.comment.body, '/alpha ')) }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check permission and react to comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          PERMISSION=$(gh api "/repos/${{ github.repository }}/collaborators/${{
          github.event.comment.user.login }}/permission" -q .permission)

          if [ "$PERMISSION" != "write" ] && [ "$PERMISSION" != "admin" ]; then
            echo "::error::User ${{ github.event.comment.user.login }} does not have write permission (has: $PERMISSION)."
            exit 1
          fi

          gh api --silent -X POST "/repos/${{ github.repository
          }}/issues/comments/${{ github.event.comment.id }}/reactions" -f
          content=eyes
      - name: Create comment
        id: create-comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Alpha release has been initiated (for more information, click
            [here](https://github.com/webiny/webiny-js/actions/runs/${{
            github.run_id }})). :sparkles:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  prBranch:
    needs: checkComment
    name: Get PR branch
    outputs:
      pr-branch: ${{ steps.pr-branch.outputs.pr-branch }}
      release-version: ${{ steps.release-version.outputs.release-version }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get PR branch
        id: pr-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          echo "pr-branch=$(gh pr view ${{ github.event.issue.number }} --repo
          ${{ github.repository }} --json headRefName -q .headRefName)" >>
          $GITHUB_OUTPUT
      - name: Parse release version from branch name
        id: release-version
        run: >-
          BRANCH="${{ steps.pr-branch.outputs.pr-branch }}"

          VERSION="${BRANCH#release/}"

          if [ "$VERSION" = "$BRANCH" ]; then echo "Branch does not match
          release/* pattern" && exit 1; fi

          echo "release-version=$VERSION" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  constants:
    needs:
      - checkComment
      - prBranch
    name: Create constants
    outputs:
      run-cache-key: ${{ steps.run-cache-key.outputs.run-cache-key }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create workflow run cache key
        id: run-cache-key
        run: >-
          echo "run-cache-key=${{ github.run_id }}-${{ github.run_attempt }}-${{
          vars.RANDOM_CACHE_KEY_SUFFIX }}" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  build:
    name: Build
    needs:
      - prBranch
      - constants
    runs-on: webiny-build-packages
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  npmReleaseAlpha:
    needs:
      - prBranch
      - constants
      - build
    name: NPM release ("alpha" tag)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SLACK_RELEASE_CHANNEL_WEBHOOK: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Create ".npmrc" file in the project root
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git username
        run: git config --global user.name "webiny-bot"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Version and publish "alpha" tag to NPM
        id: release
        run: >-
          set -o pipefail

          yarn release --type=alpha --version=${{
          needs.prBranch.outputs.release-version }} 2>&1 | tee
          /tmp/release-output.txt

          ALPHA_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+'
          /tmp/release-output.txt | tail -1)

          echo "alpha-version=$ALPHA_VERSION" >> $GITHUB_OUTPUT
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Notify Slack - Alpha Release
        env:
          ALPHA_VERSION: ${{ steps.release.outputs.alpha-version }}
        run: >-
          [ -z "$SLACK_RELEASE_CHANNEL_WEBHOOK" ] && echo "Slack webhook not
          configured, skipping." && exit 0

          PROJECT_NAME=webiny-$(echo $ALPHA_VERSION | tr . -)

          INSTALL_CMD="npx create-webiny-project@${ALPHA_VERSION}
          ${PROJECT_NAME}"

          MSG="Webiny \`${ALPHA_VERSION}\` (alpha) is out! :rocket:\nTo install,
          run: \`\`\`${INSTALL_CMD}\`\`\`"

          curl -s -o /dev/null -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"${MSG}\"}" \
            "$SLACK_RELEASE_CHANNEL_WEBHOOK"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

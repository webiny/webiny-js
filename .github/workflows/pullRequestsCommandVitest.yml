name: Pull Requests Command - Vitest
'on': issue_comment
env:
  NODE_OPTIONS: '--max_old_space_size=4096'
  AWS_REGION: eu-central-1
jobs:
  checkComment:
    name: Check comment for /vitest
    if: ${{ github.event.issue.pull_request }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check for Command
        id: command
        uses: xt0rted/slash-command-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: vitest
          reaction: 'true'
          reaction-type: eyes
          allow-edits: 'false'
          permission-level: write
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Vitest tests have been initiated (for more information, click
            [here](https://github.com/webiny/webiny-js/actions/runs/${{
            github.run_id }})). :sparkles:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  baseBranch:
    needs: checkComment
    name: Get base branch
    outputs:
      base-branch: ${{ steps.base-branch.outputs.base-branch }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
      - name: Get base branch
        id: base-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          echo "base-branch=$(gh pr view ${{ github.event.issue.number }} --json
          baseRefName -q .baseRefName)" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  constants:
    needs: baseBranch
    name: Create constants
    outputs:
      global-cache-key: ${{ steps.global-cache-key.outputs.global-cache-key }}
      run-cache-key: ${{ steps.run-cache-key.outputs.run-cache-key }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create global cache key
        id: global-cache-key
        run: >-
          echo "global-cache-key=${{ needs.baseBranch.outputs.base-branch }}-${{
          runner.os }}-$(/bin/date -u "+%m%d")-${{ vars.RANDOM_CACHE_KEY_SUFFIX
          }}" >> $GITHUB_OUTPUT
      - name: Create workflow run cache key
        id: run-cache-key
        run: >-
          echo "run-cache-key=${{ github.run_id }}-${{ github.run_attempt }}-${{
          vars.RANDOM_CACHE_KEY_SUFFIX }}" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  build:
    name: Build
    needs:
      - baseBranch
      - constants
    runs-on: webiny-build-packages
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.global-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-constants:
    needs:
      - build
    name: Vitest (No storage) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - id: list-vitest-test-commands
        name: List Vitest Test Commands
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          echo "vitest-test-commands=$(node
          .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js
          '[""]')" >> "$GITHUB_OUTPUT"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-run:
    needs:
      - constants
      - vitest-constants
    name: ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node:
          - 24
        testCommand: ${{ fromJSON(needs.vitest-constants.outputs.vitest-test-commands) }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Run tests
        run: yarn test ${{ matrix.testCommand.cmd }}
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
  vitest-ddb-constants:
    needs:
      - build
    name: Vitest (DDB) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - id: list-vitest-test-commands
        name: List Vitest Test Commands
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          echo "vitest-test-commands=$(node
          .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js
          '["ddb"]')" >> "$GITHUB_OUTPUT"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-ddb-run:
    needs:
      - constants
      - vitest-ddb-constants
    name: ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node:
          - 24
        testCommand: >-
          ${{ fromJSON(needs.vitest-ddb-constants.outputs.vitest-test-commands)
          }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Run tests
        run: yarn test ${{ matrix.testCommand.cmd }}
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
  vitest-ddb-os-constants:
    needs:
      - build
    name: Vitest (DDB+OS) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - id: list-vitest-test-commands
        name: List Vitest Test Commands
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          echo "vitest-test-commands=$(node
          .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js
          '["ddb-os,ddb"]')" >> "$GITHUB_OUTPUT"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  vitest-ddb-os-run:
    needs:
      - constants
      - vitest-ddb-os-constants
    name: ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node:
          - 24
        testCommand: >-
          ${{
          fromJSON(needs.vitest-ddb-os-constants.outputs.vitest-test-commands)
          }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
      OPENSEARCH_INDEX_PREFIX: ${{ matrix.testCommand.id }}
    services:
      opensearch:
        image: opensearchproject/opensearch:3.3.2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - '9200:9200'
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Wait for OpenSearch
        run: >-
          set -euo pipefail


          for i in $(seq 1 60); do
            if curl -sf "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null; then
              echo "OpenSearch is up:"
              curl -s http://localhost:9200
              exit 0
            fi
            sleep 5
          done


          echo "::error::OpenSearch did not answer on localhost:9200 within 5
          minutes."

          exit 1
      - name: Run tests
        run: yarn test ${{ matrix.testCommand.cmd }}
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}

      actions: write
  e2e-standalone-sqlite-wcp:
    needs:
      - baseBranch
      - e2e-standalone-sqlite-wcp-build
    name: E2E - Standalone (SQLite, WCP) / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          git fetch --no-tags origin refs/pull/${{ github.event.issue.number
          }}/head

          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: yarn --immutable
      - name: Download API and Admin builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: standalone-build-sqlite-wcp
      - name: Extract API and Admin builds
        run: tar -xf standalone-build-sqlite-wcp.tzst --use-compress-program=zstdmt
      - name: Start API
        env:
          PORT: '3002'
          WEBINY_SQL_FILENAME: >-
            ${{ github.workspace
            }}/new-webiny-project-standalone/.webiny/server.sqlite
          WEBINY_API_URL: http://localhost:3002
          WEBINY_ADMIN_URL: http://localhost:3001
          WEBINY_LOCAL_STORAGE_PATH: >-
            ${{ github.workspace
            }}/new-webiny-project-standalone/.webiny/storage
          WEBINY_UPLOAD_SECRET: e2e-upload-secret
          WEBINY_PROJECT_ID: ${{ secrets.E2E_WEBINY_PROJECT_ID }}
          WEBINY_PROJECT_API_KEY: ${{ secrets.E2E_WEBINY_PROJECT_API_KEY }}
        run: >-
          mkdir -p "$(dirname "${WEBINY_SQL_FILENAME:-/tmp/unused}")"

          mkdir -p "${WEBINY_LOCAL_STORAGE_PATH:-/tmp/unused}"

          cd
          new-webiny-project-standalone/.webiny/workspace/apps/api/graphql/build

          nohup node start.mjs > /tmp/webiny-api.log 2>&1 &

          echo "API starting on port 3002"
      - name: Serve Admin
        run: >-
          nohup npx --yes serve -s
          new-webiny-project-standalone/.webiny/workspace/apps/admin/build -l
          3001 > /tmp/webiny-admin.log 2>&1 &

          echo "Admin starting on port 3001"
      - name: Wait for API and Admin
        run: >-
          set -euo pipefail


          wait_for_port() {
            for _ in $(seq 1 90); do
              if (echo > /dev/tcp/127.0.0.1/"$1") >/dev/null 2>&1; then
                echo "port $1 is accepting connections"
                return 0
              fi
              sleep 2
            done
            echo "::error::Timed out waiting for port $1."
            return 1
          }


          wait_for_port 3002

          wait_for_port 3001


          # A listening socket is not the same as a working GraphQL endpoint.

          curl -fsS -X POST http://localhost:3002/graphql -H 'content-type:
          application/json' \
            -d '{"query":"{__typename}"}' > /dev/null
          echo "GraphQL API responded."
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          echo "version=$(yarn workspace e2e-tests playwright --version | cut
          -d' ' -f2)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}/e2e
        run: >-
          yarn playwright install chromium

          if yarn node --input-type=module -e "import { chromium } from
          'playwright'; const browser = await chromium.launch(); await
          browser.close();"; then
            echo "Chromium starts without installing system packages."
          else
            echo "::warning::Chromium did not start. Installing its system packages."
            yarn playwright install-deps chromium
          fi
      - name: E2E - run installation wizard test
        id: e2e-installation
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        env:
          E2E_ADMIN_URL: http://localhost:3001
          E2E_INSTALLATION: '1'
          E2E_TELEMETRY_DISABLED: '1'
        run: |-
          rm -f e2e/.e2e/summary.md
          yarn e2e --tag installation --reporter list,junit,markdown
      - name: E2E - installation - write job summary
        if: always() && steps.e2e-installation.outcome != 'skipped'
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: |-
          if [ -f e2e/.e2e/summary.md ]; then
            echo "## E2E - installation" >> "$GITHUB_STEP_SUMMARY"
            cat e2e/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: E2E - upload installation test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: e2e-results-standalone-sqlite-wcp-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: ${{ needs.baseBranch.outputs.base-branch }}/e2e/.e2e
      - name: AI E2E - run tests
        id: ai-e2e-tests
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
          E2E_ADMIN_URL: http://localhost:3001
          E2E_TELEMETRY_DISABLED: '1'
          E2E_CACHE_MODE: read-write
        run: >-
          rm -f e2e/.e2e/summary.md

          if [ ! -f e2e/e2e.config.ts ]; then
            echo "::notice::This branch has no e2e/ folder. Skipping the AI E2E tests."
            exit 0
          fi

          yarn e2e --exclude-tag installation --shard ${{ matrix.shard }}/3
          --pass-with-no-tests --reporter list,junit,markdown
      - name: AI E2E - tests - write job summary
        if: always() && steps.ai-e2e-tests.outcome != 'skipped'
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: |-
          if [ -f e2e/.e2e/summary.md ]; then
            echo "## AI E2E - tests" >> "$GITHUB_STEP_SUMMARY"
            cat e2e/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: AI E2E - upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ai-e2e-results-standalone-sqlite-wcp-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: ${{ needs.baseBranch.outputs.base-branch }}/e2e/.e2e
      - name: AI E2E - collect new replay recordings
        id: e2e-cache
        if: always()
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          mkdir -p "$RUNNER_TEMP/e2e-cache"

          git status --porcelain --untracked-files=all -- e2e/cache | awk '{
          print $2 }' |
            while read -r file; do cp "$file" "$RUNNER_TEMP/e2e-cache/"; done
          count=$(find "$RUNNER_TEMP/e2e-cache" -type f | wc -l | tr -d " ")

          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt 0 ]; then
            echo "## Replay cache" >> "$GITHUB_STEP_SUMMARY"
            echo "This shard recorded $count new or changed replay entries. The E2E - Commit replay recordings job commits them to the PR branch." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: AI E2E - upload new replay recordings
        if: always() && steps.e2e-cache.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-cache-sqlite-wcp-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: ignore
          path: ${{ runner.temp }}/e2e-cache
      - name: Print server logs
        if: failure()
        run: >-
          echo "::group::API log"; cat /tmp/webiny-api.log || true; echo
          "::endgroup::"

          echo "::group::Admin log"; cat /tmp/webiny-admin.log || true; echo
          "::endgroup::"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  e2e-standalone-sqlite-wcp-report:
    needs:
      - checkComment
      - e2e-standalone-sqlite-wcp-build
      - e2e-standalone-sqlite-wcp
    name: E2E - Standalone (SQLite, WCP) - Report status
    if: >-
      ${{ !cancelled() && needs.checkComment.outputs.comment-id != '' &&
      contains(fromJSON('["adrians5j"]'), github.event.comment.user.login) }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Check the shards' result
        env:
          BUILD_RESULT: ${{ needs.e2e-standalone-sqlite-wcp-build.result }}
          TESTS_RESULT: ${{ needs.e2e-standalone-sqlite-wcp.result }}
        run: |-
          echo "build: $BUILD_RESULT, tests: $TESTS_RESULT"
          [ "$TESTS_RESULT" = "success" ]
      - name: Update PR comment - Standalone (SQLite, WCP) passed
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i -E "s@^\| Standalone \(SQLite, WCP\) \|.*@| Standalone (SQLite,
          WCP) | ✅ Passed | - |@" /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
      - name: Update PR comment - Standalone (SQLite, WCP) failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i -E "s@^\| Standalone \(SQLite, WCP\) \|.*@| Standalone (SQLite,
          WCP) | ❌ Failed | - |@" /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false

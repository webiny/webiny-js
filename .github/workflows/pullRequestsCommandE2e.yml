      - name: Update PR comment - DDB passed
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
          ADMIN_URL: ${{ needs.e2e-aws-ddb-deploy.outputs.admin-url }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i -E "s@^\| DDB \|.*@| DDB | ✅ Passed | ${ADMIN_URL:--} |@"
          /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
      - name: Update PR comment - DDB failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
          ADMIN_URL: ${{ needs.e2e-aws-ddb-deploy.outputs.admin-url }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i -E "s@^\| DDB \|.*@| DDB | ❌ Failed | ${ADMIN_URL:--} |@"
          /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  e2e-aws-ddb-os-deploy:
    needs:
      - baseBranch
      - publish
      - checkComment
    name: E2E - DDB+OS - Deploy
    permissions:
      contents: read
      actions: write
      id-token: write
      pull-requests: write
    outputs:
      admin-url: ${{ steps.admin-url.outputs.admin-url }}
    environment: next
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_SECRETS_PROVIDER: ${{ secrets.PULUMI_SECRETS_PROVIDER }}
      WEBINY_INFRA_API_MAX_BUNDLE_SIZE: ${{ vars.WEBINY_INFRA_API_MAX_BUNDLE_SIZE }}
      BUG_REPORT_GITHUB_TOKEN: ${{ secrets.BUG_REPORT_GITHUB_TOKEN }}
      BUG_REPORT_REPOSITORY: ${{ vars.BUG_REPORT_REPOSITORY }}
      AWS_OPENSEARCH_DOMAIN_NAME: ${{ secrets.OPENSEARCH_DOMAIN_NAME }}
      OPENSEARCH_ENDPOINT: ${{ secrets.OPENSEARCH_ENDPOINT }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      OPENSEARCH_INDEX_PREFIX: ${{ github.run_id }}_
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Configure AWS Credentials
        uses: >-
          aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::726952677045:role/GitHubActionsWebinyJs
          aws-region: eu-central-1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          git fetch --no-tags origin refs/pull/${{ github.event.issue.number
          }}/head

          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: yarn --immutable
      - name: Download Verdaccio storage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verdaccio-storage
      - name: Extract Verdaccio storage
        run: >-
          tar -xf verdaccio-storage.tzst --use-compress-program=zstdmt -C "${{
          needs.baseBranch.outputs.base-branch }}"
      - name: Start Verdaccio local server
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          yarn add pm2 verdaccio && npx pm2 start verdaccio -- -c
          .verdaccio.yaml
      - name: Configure NPM to use local registry
        run: npm config set registry http://localhost:4873
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Disable Webiny telemetry
        run: >
          mkdir ~/.webiny && echo '{ "id": "ci", "telemetry": false }' >
          ~/.webiny/config
      - name: Create a new Webiny project
        run: >
          npx create-webiny-project@local-npm new-webiny-project --tag local-npm
          --no-interactive --assign-to-yarnrc
          '{"npmRegistryServer":"http://localhost:4873","unsafeHttpWhitelist":["localhost"]}'
          --template-options '{"region":"${{ env.AWS_REGION
          }}","storageOps":"ddb-os"}'
      - name: Configure OpenSearch domain name and index prefix in webiny.config.tsx
        working-directory: new-webiny-project
        run: >-
          sed -i 's|<Infra.OpenSearch enabled={true} />|<Infra.OpenSearch
          enabled={true} domainName={process.env.AWS_OPENSEARCH_DOMAIN_NAME \|\|
          "webiny-e2e-os"} indexPrefix={process.env.OPENSEARCH_INDEX_PREFIX \|\|
          ""} endpoint={process.env.OPENSEARCH_ENDPOINT}
          username={process.env.OPENSEARCH_USERNAME}
          password={process.env.OPENSEARCH_PASSWORD} />|g' webiny.config.tsx
      - name: Configure the bug reporter in webiny.config.tsx
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-

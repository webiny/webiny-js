      - name: Configure NPM to use local registry
        run: npm config set registry http://localhost:4873
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Disable Webiny telemetry
        run: >
          mkdir ~/.webiny && echo '{ "id": "ci", "telemetry": false }' >
          ~/.webiny/config
      - name: Create a new standalone Webiny project
        run: >-
          npx create-webiny-project@local-npm new-webiny-project-standalone
          --tag local-npm --no-interactive --hosting-type standalone
          --assign-to-yarnrc
          '{"npmRegistryServer":"http://localhost:4873","unsafeHttpWhitelist":["localhost"]}'
          --template-options '{"storageOps":"sqlite"}'
      - name: Configure the bug reporter in webiny.config.tsx
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          node
          .github/workflows/wac/utils/runNodeScripts/configureBugReporter.js
          '${{ github.workspace }}/new-webiny-project-standalone'
      - name: Print CLI version
        working-directory: new-webiny-project-standalone
        run: yarn webiny --version
      - name: Build API and Admin
        working-directory: new-webiny-project-standalone
        env:
          WEBINY_HOSTING_TYPE: standalone
          WEBINY_API_URL: http://localhost:3002
          BUG_REPORT_GITHUB_TOKEN: ${{ secrets.BUG_REPORT_GITHUB_TOKEN }}
          BUG_REPORT_REPOSITORY: ${{ vars.BUG_REPORT_REPOSITORY }}
          WEBINY_PROJECT_ID: ${{ secrets.E2E_WEBINY_PROJECT_ID }}
          WEBINY_PROJECT_API_KEY: ${{ secrets.E2E_WEBINY_PROJECT_API_KEY }}
        run: yarn webiny build api && yarn webiny build admin
      - name: Compress API and Admin builds
        run: >-
          tar -cf standalone-build-sqlite-wcp.tzst --use-compress-program=zstdmt
          new-webiny-project-standalone/.webiny/workspace/apps/api/graphql/build

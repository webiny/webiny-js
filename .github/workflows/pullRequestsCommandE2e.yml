          ${WEBINY_INFRA_API_MAX_BUNDLE_SIZE:-6291456} bytes"
      - name: Deploy Core
        working-directory: new-webiny-project
        run: yarn webiny deploy core --env dev
      - name: Deploy API
        working-directory: new-webiny-project
        run: yarn webiny deploy api --env dev
      - name: Deploy Admin Area
        working-directory: new-webiny-project
        run: yarn webiny deploy admin --env dev
      - name: Extract admin app URL
        id: admin-url
        working-directory: new-webiny-project
        run: >-
          echo "admin-url=$(yarn webiny output admin --env dev --json
          2>/dev/null | jq -r '.appUrl // empty')" >> $GITHUB_OUTPUT
      - name: Update PR comment with admin URL
        env:

name: 💬 PR Command - E2E
'on':
  issue_comment:
    types:
      - created
env:
  NODE_OPTIONS: '--max_old_space_size=4096'
  AWS_REGION: eu-central-1
jobs:
  checkComment:
    name: Check comment for /e2e
    if: >-
      ${{ github.event.issue.pull_request && (github.event.comment.body ==
      '/e2e' || startsWith(github.event.comment.body, '/e2e ')) }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    outputs:
      comment-id: ${{ steps.create-comment.outputs.comment-id }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Check permission and react to comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          PERMISSION=$(gh api "/repos/${{ github.repository }}/collaborators/${{
          github.event.comment.user.login }}/permission" -q .permission)

          if [ "$PERMISSION" != "write" ] && [ "$PERMISSION" != "admin" ]; then
            echo "::error::User ${{ github.event.comment.user.login }} does not have write permission (has: $PERMISSION)."
            exit 1
          fi

          gh api --silent -X POST "/repos/${{ github.repository
          }}/issues/comments/${{ github.event.comment.id }}/reactions" -f
          content=eyes
      - name: Create comment
        id: create-comment
        uses: >-
          peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            E2E tests have been initiated (for more information, click
            [here](https://github.com/webiny/webiny-js/actions/runs/${{
            github.run_id }})). :sparkles:


            | Database | Status | Admin URL |

            | --- | --- | --- |

            | DDB | 🔄 Deploying... | - |

            | DDB+OS | 🔄 Deploying... | - |

            | Standalone (SQLite) | 🔄 Running... | - |

            | Standalone (Postgres) | 🔄 Running... | - |

            ${{ contains(fromJSON('["adrians5j"]'),
            github.event.comment.user.login) && '| Standalone (SQLite, WCP) | 🔄
            Running... | - |' || '' }}

            ${{ contains(fromJSON('["adrians5j"]'),
            github.event.comment.user.login) && '| Standalone (Postgres, WCP) |
            🔄 Running... | - |' || '' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  baseBranch:
    needs: checkComment
    name: Get base branch
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      base-branch: ${{ steps.base-branch.outputs.base-branch }}
      pr-sha: ${{ steps.pr-sha.outputs.pr-sha }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Get base branch
        id: base-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          echo "base-branch=$(gh pr view ${{ github.event.issue.number }} --json
          baseRefName -q .baseRefName)" >> $GITHUB_OUTPUT
      - name: Get PR head SHA
        id: pr-sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          echo "pr-sha=$(gh pr view ${{ github.event.issue.number }} --json
          headRefOid -q .headRefOid)" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  constants:
    needs: baseBranch
    name: Create constants
    outputs:
      global-cache-key: ${{ steps.global-cache-key.outputs.global-cache-key }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Create global cache key
        id: global-cache-key
        run: >-
          echo "global-cache-key=${{ needs.baseBranch.outputs.base-branch }}-${{
          runner.os }}-$(/bin/date -u "+%m%d")-${{ vars.RANDOM_CACHE_KEY_SUFFIX
          }}" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  build:
    name: Build
    needs:
      - baseBranch
      - constants
    runs-on: webiny-build-packages
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          git fetch --no-tags origin refs/pull/${{ github.event.issue.number
          }}/head

          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.global-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Compress build cache
        run: >-
          tar -cf run-build-cache.tzst --use-compress-program=zstdmt -C
          "${WEBINY_JS_DIR:-.}" .webiny/cached-packages
        env:
          WEBINY_JS_DIR: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Upload build cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: run-build-cache
          path: run-build-cache.tzst
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  publish:
    name: Publish to Verdaccio
    needs:
      - baseBranch
      - build
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          git fetch --no-tags origin refs/pull/${{ github.event.issue.number
          }}/head

          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Download build cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: run-build-cache
        continue-on-error: true
      - name: Extract build cache
        run: >-
          if [ ! -f run-build-cache.tzst ]; then
            echo "::warning::No build cache artifact - building from scratch. This job will be slower than usual."
            exit 0
          fi

          tar -xf run-build-cache.tzst --use-compress-program=zstdmt -C
          "${WEBINY_JS_DIR:-.}"
        env:
          WEBINY_JS_DIR: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Start Verdaccio local server
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          yarn add pm2 verdaccio && npx pm2 start verdaccio -- -c
          .verdaccio.yaml
      - name: Configure NPM to use local registry
        run: npm config set registry http://localhost:4873
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Create ".npmrc" file in the project root, with a dummy auth token
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo '//localhost:4873/:_authToken="dummy-auth-token"' > .npmrc
      - name: Version and publish to Verdaccio
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: yarn release --type=verdaccio
      - name: Compress Verdaccio storage
        run: >-
          tar -cf verdaccio-storage.tzst --use-compress-program=zstdmt -C "${{
          needs.baseBranch.outputs.base-branch }}" .verdaccio
      - name: Upload Verdaccio storage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verdaccio-storage
          path: verdaccio-storage.tzst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  e2e-aws-ddb-deploy:
    needs:

        with:
          name: e2e-results-ddb
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: ${{ needs.baseBranch.outputs.base-branch }}/e2e/.e2e
    runs-on: ubuntu-latest
  e2e-aws-ddb:
    needs:
      - baseBranch
      - e2e-aws-ddb-deploy
    name: E2E - DDB / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

  e2e-standalone-sqlite-report:
    needs:
      - checkComment
      - e2e-standalone-sqlite-build
      - e2e-standalone-sqlite
    name: E2E - Standalone (SQLite) - Report status
    if: ${{ !cancelled() && needs.checkComment.outputs.comment-id != '' }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Check the shards' result
        env:
          BUILD_RESULT: ${{ needs.e2e-standalone-sqlite-build.result }}
          TESTS_RESULT: ${{ needs.e2e-standalone-sqlite.result }}
        run: |-
          echo "build: $BUILD_RESULT, tests: $TESTS_RESULT"
          [ "$TESTS_RESULT" = "success" ]
      - name: Update PR comment - Standalone (SQLite) passed
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i -E "s@^\| Standalone \(SQLite\) \|.*@| Standalone (SQLite) | ✅
          Passed | - |@" /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
      - name: Update PR comment - Standalone (SQLite) failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i -E "s@^\| Standalone \(SQLite\) \|.*@| Standalone (SQLite) | ❌
          Failed | - |@" /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  e2e-standalone-postgres-build:
    needs:
      - baseBranch
      - publish
      - checkComment
    name: E2E - Standalone (Postgres) - Build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webiny
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          git fetch --no-tags origin refs/pull/${{ github.event.issue.number
          }}/head

          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Install dependencies
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: yarn --immutable
      - name: Download Verdaccio storage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verdaccio-storage
      - name: Extract Verdaccio storage
        run: >-
          tar -xf verdaccio-storage.tzst --use-compress-program=zstdmt -C "${{
          needs.baseBranch.outputs.base-branch }}"
      - name: Start Verdaccio local server
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          yarn add pm2 verdaccio && npx pm2 start verdaccio -- -c
          .verdaccio.yaml
      - name: Configure NPM to use local registry
        run: npm config set registry http://localhost:4873
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Disable Webiny telemetry
        run: >
          mkdir ~/.webiny && echo '{ "id": "ci", "telemetry": false }' >
          ~/.webiny/config
      - name: Create a new standalone Webiny project
        run: >-
          npx create-webiny-project@local-npm new-webiny-project-standalone
          --tag local-npm --no-interactive --hosting-type standalone
          --assign-to-yarnrc
          '{"npmRegistryServer":"http://localhost:4873","unsafeHttpWhitelist":["localhost"]}'
          --template-options '{"storageOps":"postgres"}'
      - name: Configure the bug reporter in webiny.config.tsx
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          node
          .github/workflows/wac/utils/runNodeScripts/configureBugReporter.js
          '${{ github.workspace }}/new-webiny-project-standalone'
      - name: Print CLI version
        working-directory: new-webiny-project-standalone
        run: yarn webiny --version
      - name: Build API and Admin
        working-directory: new-webiny-project-standalone
        env:
          WEBINY_HOSTING_TYPE: standalone
          WEBINY_API_URL: http://localhost:3002
          BUG_REPORT_GITHUB_TOKEN: ${{ secrets.BUG_REPORT_GITHUB_TOKEN }}
          BUG_REPORT_REPOSITORY: ${{ vars.BUG_REPORT_REPOSITORY }}
        run: yarn webiny build api && yarn webiny build admin
      - name: Compress API and Admin builds
        run: >-
          tar -cf standalone-build-postgres.tzst --use-compress-program=zstdmt
          new-webiny-project-standalone/.webiny/workspace/apps/api/graphql/build
          new-webiny-project-standalone/.webiny/workspace/apps/admin/build
      - name: Upload API and Admin builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standalone-build-postgres
          path: standalone-build-postgres.tzst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write

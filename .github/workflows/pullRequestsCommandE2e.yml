        working-directory: new-webiny-project
        run: yarn webiny --version
      - name: Create project-files artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: project-files-ddb-os
          retention-days: 1
          include-hidden-files: true
          path: |-
            new-webiny-project/
            !new-webiny-project/node_modules/**/*
            !new-webiny-project/**/node_modules/**/*
            !new-webiny-project/.yarn/cache/**/*
      - name: Enable extension whitelabeling
        working-directory: new-webiny-project
        run: yarn webiny extension whitelabeling
      - name: Enable extension bug-report-ai
        working-directory: new-webiny-project
        run: yarn webiny extension bug-report-ai
      - name: API bundle size limit
        run: >-
          echo "API bundle size limit:
          ${WEBINY_INFRA_API_MAX_BUNDLE_SIZE:-6291456} bytes"
      - name: Deploy Core
        working-directory: new-webiny-project
        run: yarn webiny deploy core --env dev
      - name: Deploy API
        working-directory: new-webiny-project
        run: yarn webiny deploy api --env dev
      - name: Deploy Admin Area
        working-directory: new-webiny-project
        run: yarn webiny deploy admin --env dev
      - name: Verify DDB+OS deployment
        working-directory: new-webiny-project
        run: >-
          OUTPUT=$(yarn webiny output core --env dev --json) && echo "$OUTPUT"
          && echo "$OUTPUT" | jq -e '.databaseSetup == "ddb+os"' || (echo
          "ERROR: Expected databaseSetup to be 'ddb+os' but got a different
          value" && exit 1)
      - name: Extract admin app URL
        id: admin-url
        working-directory: new-webiny-project
        run: >-
          echo "admin-url=$(yarn webiny output admin --env dev --json
          2>/dev/null | jq -r '.appUrl // empty')" >> $GITHUB_OUTPUT
      - name: Update PR comment with admin URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_URL: ${{ steps.admin-url.outputs.admin-url }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
        run: >-
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/comment.txt

          sed -i "s@| DDB+OS | 🔄 Deploying... | - |@| DDB+OS | ✅ Ready |
          $ADMIN_URL |@" /tmp/comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/comment.txt
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          echo "version=$(yarn workspace e2e-tests playwright --version | cut
          -d' ' -f2)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: >-
            playwright-${{ runner.os }}-${{
            steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}/e2e
        run: >-
          yarn playwright install chromium

          if yarn node --input-type=module -e "import { chromium } from
          'playwright'; const browser = await chromium.launch(); await
          browser.close();"; then
            echo "Chromium starts without installing system packages."
          else
            echo "::warning::Chromium did not start. Installing its system packages."
            yarn playwright install-deps chromium
          fi
      - name: E2E - run installation wizard test
        id: e2e-installation
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        env:
          E2E_ADMIN_URL: ${{ steps.admin-url.outputs.admin-url }}
          E2E_INSTALLATION: '1'
          E2E_TELEMETRY_DISABLED: '1'
        run: |-
          rm -f e2e/.e2e/summary.md
          yarn e2e --tag installation --reporter list,junit,markdown
      - name: E2E - installation - write job summary
        if: always() && steps.e2e-installation.outcome != 'skipped'
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: |-
          if [ -f e2e/.e2e/summary.md ]; then
            echo "## E2E - installation" >> "$GITHUB_STEP_SUMMARY"
            cat e2e/.e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: E2E - upload installation test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: e2e-results-ddb-os
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: ${{ needs.baseBranch.outputs.base-branch }}/e2e/.e2e
    runs-on: ubuntu-latest

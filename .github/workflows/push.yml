  e2eTests-ddb-os-setup:
    needs:
      - constants
      - build
      - e2eTests-ddb-os-constants
    runs-on: webiny-build-packages
    name: E2E (DDB+OS) - Project setup
    outputs:
      cypress-config: ${{ steps.save-cypress-config.outputs.cypress-config }}
    environment: next
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      CYPRESS_MAILOSAUR_API_KEY: ${{ secrets.CYPRESS_MAILOSAUR_API_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PULUMI_SECRETS_PROVIDER: ${{ secrets.PULUMI_SECRETS_PROVIDER }}
      WEBINY_PULUMI_BACKEND: ${{ needs.e2eTests-ddb-os-constants.outputs.pulumi-backend-url }}
      WEBINY_INFRA_API_MAX_BUNDLE_SIZE: ${{ vars.WEBINY_INFRA_API_MAX_BUNDLE_SIZE }}
      AWS_OPENSEARCH_DOMAIN_NAME: ${{ secrets.OPENSEARCH_DOMAIN_NAME }}
      OPENSEARCH_ENDPOINT: ${{ secrets.OPENSEARCH_ENDPOINT }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      OPENSEARCH_INDEX_PREFIX: ${{ github.run_id }}_
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Configure AWS Credentials
        uses: >-
          aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::726952677045:role/GitHubActionsWebinyJs
          aws-region: eu-central-1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: v6
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: v6
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: v6/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: v6
      - name: Build packages
        run: yarn build
        working-directory: v6
      - name: Start Verdaccio local server
        working-directory: v6
        run: >-
          yarn add pm2 verdaccio && npx pm2 start verdaccio -- -c
          .verdaccio.yaml
      - name: Configure NPM to use local registry
        run: npm config set registry http://localhost:4873
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Create ".npmrc" file in the project root, with a dummy auth token
        run: echo '//localhost:4873/:_authToken="dummy-auth-token"' > .npmrc
        working-directory: v6
      - name: Version and publish to Verdaccio
        run: yarn release --type=verdaccio
        working-directory: v6
      - name: Create verdaccio-files artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verdaccio-files-ddb-os
          retention-days: 1
          include-hidden-files: true
          path: |-
            v6/.verdaccio/
            v6/.verdaccio.yaml
      - name: Disable Webiny telemetry
        run: >
          mkdir ~/.webiny && echo '{ "id": "ci", "telemetry": false }' >
          ~/.webiny/config
      - name: Create a new Webiny project
        run: >
          npx create-webiny-project@local-npm new-webiny-project --tag local-npm
          --no-interactive --assign-to-yarnrc
          '{"npmRegistryServer":"http://localhost:4873","unsafeHttpWhitelist":["localhost"]}'
          --template-options '{"region":"eu-central-1","storageOps":"ddb-os"}'
      - name: Configure OpenSearch domain name and index prefix in webiny.config.tsx
        working-directory: new-webiny-project
        run: >-
          sed -i 's|<Infra.OpenSearch enabled={true} />|<Infra.OpenSearch
          enabled={true} domainName={process.env.AWS_OPENSEARCH_DOMAIN_NAME \|\|
          "webiny-e2e-os"} indexPrefix={process.env.OPENSEARCH_INDEX_PREFIX \|\|
          ""} endpoint={process.env.OPENSEARCH_ENDPOINT}
          username={process.env.OPENSEARCH_USERNAME}
          password={process.env.OPENSEARCH_PASSWORD} />|g' webiny.config.tsx
      - name: Print CLI version
        working-directory: new-webiny-project
        run: yarn webiny --version
      - name: Create project-files artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: project-files-ddb-os
          retention-days: 1
          include-hidden-files: true
          path: |-
            new-webiny-project/
            !new-webiny-project/node_modules/**/*
            !new-webiny-project/**/node_modules/**/*
            !new-webiny-project/.yarn/cache/**/*
      - name: Enable extension whitelabeling
        working-directory: new-webiny-project
        run: yarn webiny extension whitelabeling
      - name: API bundle size limit
        run: >-
          echo "API bundle size limit:
          ${WEBINY_INFRA_API_MAX_BUNDLE_SIZE:-6291456} bytes"
      - name: Deploy Core
        working-directory: new-webiny-project
        run: yarn webiny deploy core --env dev
      - name: Deploy API
        working-directory: new-webiny-project
        run: yarn webiny deploy api --env dev
      - name: Deploy Admin Area
        working-directory: new-webiny-project
        run: yarn webiny deploy admin --env dev
      - name: Verify DDB+OS deployment
        working-directory: new-webiny-project
        run: >-
          OUTPUT=$(yarn webiny output core --env dev --json) && echo "$OUTPUT"
          && echo "$OUTPUT" | jq -e '.databaseSetup == "ddb+os"' || (echo
          "ERROR: Expected databaseSetup to be 'ddb+os' but got a different
          value" && exit 1)
      - name: Create Cypress config
        run: yarn setup-cypress --projectFolder ../new-webiny-project
        working-directory: v6
      - name: Save Cypress config
        id: save-cypress-config
        run: >-
          echo "cypress-config=$(cat cypress-tests/cypress.config.ts | tr -d
          '\t\n\r')" >> $GITHUB_OUTPUT
        working-directory: v6
      - name: Install Cypress binary
        run: cd cypress-tests && yarn cypress install
        working-directory: v6
      - name: Cypress - run installation wizard test
        run: >-
          yarn cy:run --browser chrome --spec
          "cypress/e2e/adminInstallation/**/*.cy.js"
        working-directory: v6
    permissions:
      contents: read
      actions: write
      id-token: write
  e2eTests-server-sqlite:
    needs:
      - constants
      - build
    name: E2E (Server SQLite)
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: v6
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: v6
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: v6/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: v6
      - name: Build packages
        run: yarn build --rebuild-dependents
        working-directory: v6
      - name: Start Verdaccio local server
        working-directory: v6
        run: >-
          yarn add pm2 verdaccio && npx pm2 start verdaccio -- -c
          .verdaccio.yaml
      - name: Configure NPM to use local registry
        run: npm config set registry http://localhost:4873
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Create ".npmrc" file in the project root, with a dummy auth token
        working-directory: v6
        run: echo '//localhost:4873/:_authToken="dummy-auth-token"' > .npmrc
      - name: Version and publish to Verdaccio
        working-directory: v6
        run: yarn release --type=verdaccio
      - name: Disable Webiny telemetry
        run: >
          mkdir ~/.webiny && echo '{ "id": "ci", "telemetry": false }' >
          ~/.webiny/config
      - name: Create a new self-hosted Webiny project
        run: >-
          npx create-webiny-project@local-npm new-webiny-project-server --tag
          local-npm --no-interactive --hosting-type server --assign-to-yarnrc
          '{"npmRegistryServer":"http://localhost:4873","unsafeHttpWhitelist":["localhost"]}'
          --template-options '{"storageOps":"sqlite"}'
      - name: Print CLI version
        working-directory: new-webiny-project-server
        run: yarn webiny --version
      - name: Build API and Admin
        working-directory: new-webiny-project-server
        env:
          WEBINY_HOSTING_TYPE: server
          WEBINY_API_URL: http://localhost:3002
        run: yarn webiny build api && yarn webiny build admin
      - name: Start API
        env:
          PORT: '3002'
          WEBINY_SQL_FILENAME: >-
            ${{ github.workspace
            }}/new-webiny-project-server/.webiny/server.sqlite
          WEBINY_LOCAL_STORAGE_PATH: ${{ github.workspace }}/new-webiny-project-server/.webiny/storage
        run: |-
          mkdir -p "$(dirname "${WEBINY_SQL_FILENAME:-/tmp/unused}")"
          mkdir -p "${WEBINY_LOCAL_STORAGE_PATH:-/tmp/unused}"
          cd new-webiny-project-server/.webiny/workspace/apps/api/graphql/build
          nohup node start.mjs > /tmp/webiny-api.log 2>&1 &
          echo "API starting on port 3002"
      - name: Serve Admin
        run: >-
          nohup npx --yes serve -s
          new-webiny-project-server/.webiny/workspace/apps/admin/build -l 3001 >
          /tmp/webiny-admin.log 2>&1 &

          echo "Admin starting on port 3001"
      - name: Wait for API and Admin
        run: >-
          set -euo pipefail


          wait_for_port() {
            for _ in $(seq 1 90); do
              if (echo > /dev/tcp/127.0.0.1/"$1") >/dev/null 2>&1; then
                echo "port $1 is accepting connections"
                return 0
              fi
              sleep 2
            done
            echo "::error::Timed out waiting for port $1."
            return 1
          }


          wait_for_port 3002

          wait_for_port 3001


          # A listening socket is not the same as a working GraphQL endpoint.

          curl -fsS -X POST http://localhost:3002/graphql -H 'content-type:
          application/json' \
            -d '{"query":"{__typename}"}' > /dev/null
          echo "GraphQL API responded."
      - name: Create Cypress config
        working-directory: v6
        run: >-
          yarn setup-cypress:server --apiUrl http://localhost:3002 --adminUrl
          http://localhost:3001
      - name: Install Cypress binary
        working-directory: v6
        run: cd cypress-tests && yarn cypress install
      - name: Cypress - run installation wizard test
        working-directory: v6
        run: >-
          yarn cy:run --browser chrome --spec
          "cypress/e2e/adminInstallation/**/*.cy.js"
      - name: Print server logs
        if: failure()
        run: >-
          echo "::group::API log"; cat /tmp/webiny-api.log || true; echo
          "::endgroup::"

          echo "::group::Admin log"; cat /tmp/webiny-admin.log || true; echo
          "::endgroup::"
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cypress-screenshots-server-sqlite
          retention-days: 1
          if-no-files-found: ignore
          path: v6/cypress-tests/cypress/screenshots
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write

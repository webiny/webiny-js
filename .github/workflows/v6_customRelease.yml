name: 📦 v6 Custom Release
'on':
  repository_dispatch:
    types:
      - release-v6
jobs:
  constants:
    name: Create constants
    outputs:
      global-cache-key: ${{ steps.global-cache-key.outputs.global-cache-key }}
      run-cache-key: ${{ steps.run-cache-key.outputs.run-cache-key }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: useblacksmith/checkout@v1
      - name: Create global cache key
        id: global-cache-key
        run: >-
          echo "global-cache-key=${{ github.event.client_payload.branch }}-${{
          runner.os }}-$(/bin/date -u "+%m%d")-${{ vars.RANDOM_CACHE_KEY_SUFFIX
          }}" >> $GITHUB_OUTPUT
      - name: Create workflow run cache key
        id: run-cache-key
        run: >-
          echo "run-cache-key=${{ github.run_id }}-${{ github.run_attempt }}-${{
          vars.RANDOM_CACHE_KEY_SUFFIX }}" >> $GITHUB_OUTPUT
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  build:
    name: Build
    needs: constants
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: useblacksmith/checkout@v1
        with:
          path: ${{ github.event.client_payload.branch }}
          ref: ${{ github.event.client_payload.branch }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ github.event.client_payload.branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.event.client_payload.branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.global-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ github.event.client_payload.branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ github.event.client_payload.branch }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.event.client_payload.branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  npmRelease:
    needs:
      - constants
      - build
    name: NPM release ("${{ github.event.client_payload.tag }}" tag)
    environment: release
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_TYPE: ${{ github.event.client_payload.type }}
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
      RELEASE_VERSION: ${{ github.event.client_payload.version }}
      RELEASE_CREATE_GITHUB_RELEASE: ${{ github.event.client_payload.createGithubRelease }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: useblacksmith/checkout@v1
        with:
          path: ${{ github.event.client_payload.branch }}
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ github.event.client_payload.branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.event.client_payload.branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ github.event.client_payload.branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ github.event.client_payload.branch }}
      - name: Create ".npmrc" file in the project root
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
        working-directory: ${{ github.event.client_payload.branch }}
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
        working-directory: ${{ github.event.client_payload.branch }}
      - name: Set git username
        run: git config --global user.name "webiny-bot"
        working-directory: ${{ github.event.client_payload.branch }}
      - name: Version and publish to NPM
        run: >-
          yarn release --type="$RELEASE_TYPE" --tag="$RELEASE_TAG"
          --version="$RELEASE_VERSION"
          --createGithubRelease="$RELEASE_CREATE_GITHUB_RELEASE"
        working-directory: ${{ github.event.client_payload.branch }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: write
  notifySlackOnFailure:
    name: Notify Slack on failure
    needs:
      - constants
      - build
      - npmRelease
    if: failure()
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      SLACK_RELEASE_CHANNEL_WEBHOOK: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LABEL: 📦 v6 Custom Release
      RUN_URL: >-
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Notify Slack
        run: >-
          set -euo pipefail


          [ -z "$SLACK_RELEASE_CHANNEL_WEBHOOK" ] && echo "Slack webhook not
          configured, skipping." && exit 0


          # Name the jobs that actually failed, so the message says something
          without

          # anyone having to open the run first.

          FAILED=$(gh api --paginate "repos/${{ github.repository
          }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          [ -n "$FAILED" ] || FAILED="unknown job"


          # Built with jq, not string interpolation: job names here contain
          double quotes

          # (`NPM release ("latest" tag)`) and would produce invalid JSON
          otherwise.

          jq -nc --arg label "$LABEL" --arg failed "$FAILED" --arg url
          "$RUN_URL" \
            '{ text: ":rotating_light: \($label) failed: \($failed)\n\($url)" }' \
            > /tmp/slack-payload.json

          curl -s -o /dev/null -X POST \
            -H "Content-type: application/json" \
            --data @/tmp/slack-payload.json \
            "$SLACK_RELEASE_CHANNEL_WEBHOOK"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: write

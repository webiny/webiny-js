# A config for the "aws-nuke" tool which destroys all cloud infrastructure
# deployed into our "webiny-ci" AWS account. The config is used within
# the `.github/workflows/cleanup.yml` workflow (triggered once a day).

regions:
  - eu-central-1
  - global

blocklist:
  - "999999999999" # We don't have "production" accounts.

bypass-alias-check-accounts:
  - 726952677045

accounts:
  "726952677045":
    filters:
      S3Bucket:
        - "s3://webiny-ci"
      IAMRole:
        - "GitHubActionsWebinyJs"
        - "GitHubActionsWebinyJsAdminAccess"
        # Pulumi auto-names this role with a random suffix (e.g.
        # "scheduler-invoke-api-destination-8f773db"), so we glob-match it.
        - property: Name
          type: glob
          value: "scheduler-invoke-api-destination*"
      IAMUser:
        - "webiny-ci"
      IAMUserPolicyAttachment:
        - "webiny-ci -> AdministratorAccess"
      IAMUserAccessKey:
        - property: UserName
          value: "webiny-ci"
      IAMPolicy:
        - "DeployWebinyProjectGroup1"
        - "DeployWebinyProjectGroup2"
        - "DeployWebinyProjectGroup3"
        - "DeployWebinyProjectExtra"
      IAMRolePolicyAttachment:
        - "GitHubActionsWebinyJs -> DeployWebinyProjectGroup1"
        - "GitHubActionsWebinyJs -> DeployWebinyProjectGroup2"
        - "GitHubActionsWebinyJs -> DeployWebinyProjectGroup3"
        - "GitHubActionsWebinyJs -> DeployWebinyProjectExtra"
        - "GitHubActionsWebinyJsAdminAccess -> AdministratorAccess"
      # Inline policy on the scheduler role (auto-named by Pulumi).
      IAMRolePolicy:
        - property: "role:RoleName"
          type: glob
          value: "scheduler-invoke-api-destination*"
      IAMOpenIDConnectProvider:
        - property: Arn
          type: exact
          value: "arn:aws:iam::726952677045:oidc-provider/token.actions.githubusercontent.com"
      Route53HostedZone:
        - property: Name
          value: "ci.webiny.com."
      # --- "scheduler" Pulumi stack: daily deploy-e2e dispatcher ---
      # These EventBridge resources trigger the deploy-e2e GitHub Actions workflow
      # once a day. Pulumi auto-names them with a random suffix (e.g.
      # "daily-deploy-e2e-0b45b80"), so they MUST be glob-matched — exact names
      # never match and the schedule gets nuked every night.
      #
      # NOTE: the EventBridge Connection ("github-workflow-dispatch") and API
      # Destination ("deploy-e2e-dispatch") have no resource type in aws-nuke, so
      # they are never destroyed and need no filter. The connection's credentials,
      # however, live in a Secrets Manager secret that IS nukeable — see below.
      CloudWatchEventsRule:
        - type: glob
          value: "daily-deploy-e2e*"
      CloudWatchEventsTarget:
        - property: Name # The rule name the target is attached to.
          type: glob
          value: "daily-deploy-e2e*"
      SecretsManagerSecret:
        - property: Name
          type: glob
          value: "events!connection/github-workflow-dispatch*"

resource-types:
  excludes:
    - Budget

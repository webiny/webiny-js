name: Pull Requests Command - Beta Release
'on': issue_comment
concurrency:
  group: beta-release-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  checkComment:
    name: Check comment for /beta
    if: ${{ github.event.issue.pull_request }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check for Command
        id: command
        uses: xt0rted/slash-command-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: beta
          reaction: 'true'
          reaction-type: eyes
          allow-edits: 'false'
          permission-level: write
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Beta release has been initiated (for more information, click
            [here](https://github.com/webiny/webiny-js/actions/runs/${{
            github.run_id }})). :sparkles:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  prBranch:
    needs: checkComment
    name: Get PR branch
    outputs:
      pr-branch: ${{ steps.pr-branch.outputs.pr-branch }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get PR branch
        id: pr-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          echo "pr-branch=$(gh pr view ${{ github.event.issue.number }} --repo
          ${{ github.repository }} --json headRefName -q .headRefName)" >>
          $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  constants:
    needs:
      - checkComment
      - prBranch
    name: Create constants
    outputs:
      run-cache-key: ${{ steps.run-cache-key.outputs.run-cache-key }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create workflow run cache key
        id: run-cache-key
        run: >-
          echo "run-cache-key=${{ github.run_id }}-${{ github.run_attempt }}-${{
          vars.RANDOM_CACHE_KEY_SUFFIX }}" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  build:
    name: Build
    needs:
      - prBranch
      - constants
    runs-on: webiny-build-packages
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  npmReleaseBeta:
    needs:
      - prBranch
      - constants
      - build
    name: NPM release ("beta" tag)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SLACK_RELEASE_CHANNEL_WEBHOOK: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Create ".npmrc" file in the project root
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git username
        run: git config --global user.name "webiny-bot"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Version and publish "beta" tag to NPM
        id: release
        run: >-
          set -o pipefail

          yarn release --type=beta --tag=beta 2>&1 | tee /tmp/release-output.txt

          BETA_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+'
          /tmp/release-output.txt | tail -1)

          echo "beta-version=$BETA_VERSION" >> $GITHUB_OUTPUT
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Notify Slack - Beta Release
        env:
          BETA_VERSION: ${{ steps.release.outputs.beta-version }}
        run: >-
          PROJECT_NAME=webiny-$(echo $BETA_VERSION | tr . -)

          INSTALL_CMD="npx create-webiny-project@${BETA_VERSION}
          ${PROJECT_NAME}"

          MSG="Webiny ${BETA_VERSION} is out! :rocket:\nTo install, run:
          \`${INSTALL_CMD}\`"

          curl -s -o /dev/null -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"${MSG}\"}" \
            "$SLACK_RELEASE_CHANNEL_WEBHOOK"
    runs-on: ubuntu-latest
  npmReleaseLatest:
    needs:
      - prBranch
      - constants
      - npmReleaseBeta
    name: NPM release ("latest" tag)
    environment: release
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      LATEST_VERSION: ${{ vars.LATEST_VERSION }}
      SLACK_RELEASE_CHANNEL_WEBHOOK: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Create ".npmrc" file in the project root
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git username
        run: git config --global user.name "webiny-bot"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Version and publish "latest" tag to NPM
        id: release
        run: >-
          set -o pipefail

          yarn release --type=latest --sourceTag=beta --createGithubRelease=true
          2>&1 | tee /tmp/release-output.txt

          LATEST_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
          /tmp/release-output.txt | tail -1)

          echo "latest-version=$LATEST_VERSION" >> $GITHUB_OUTPUT
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Notify Slack - Latest Release
        env:
          LATEST_VERSION: ${{ steps.release.outputs.latest-version }}
        run: >-
          PROJECT_NAME=webiny-$(echo $LATEST_VERSION | tr . -)

          INSTALL_CMD="npx create-webiny-project@${LATEST_VERSION}
          ${PROJECT_NAME}"

          MSG="Webiny ${LATEST_VERSION} is out! :rocket:\nTo install, run:
          \`${INSTALL_CMD}\`"

          curl -s -o /dev/null -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"${MSG}\"}" \
            "$SLACK_RELEASE_CHANNEL_WEBHOOK"
    runs-on: ubuntu-latest

name: Pull Requests Command - Beta Release
'on': issue_comment
jobs:
  checkComment:
    name: Check comment for /beta
    if: ${{ github.event.issue.pull_request }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check for Command
        id: command
        uses: xt0rted/slash-command-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          command: beta
          reaction: 'true'
          reaction-type: eyes
          allow-edits: 'false'
          permission-level: write
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Beta release has been initiated (for more information, click
            [here](https://github.com/webiny/webiny-js/actions/runs/${{
            github.run_id }})). :sparkles:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  prBranch:
    needs: checkComment
    name: Get PR branch
    outputs:
      pr-branch: ${{ steps.pr-branch.outputs.pr-branch }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Get PR branch
        id: pr-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          echo "pr-branch=$(gh pr view ${{ github.event.issue.number }} --json
          headRefName -q .headRefName)" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  constants:
    needs:
      - checkComment
      - prBranch
    name: Create constants
    outputs:
      global-cache-key: ${{ steps.global-cache-key.outputs.global-cache-key }}
      run-cache-key: ${{ steps.run-cache-key.outputs.run-cache-key }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create global cache key
        id: global-cache-key
        run: >-
          echo "global-cache-key=${{ needs.prBranch.outputs.pr-branch }}-${{
          runner.os }}-$(/bin/date -u "+%m%d")-${{ vars.RANDOM_CACHE_KEY_SUFFIX
          }}" >> $GITHUB_OUTPUT
      - name: Create workflow run cache key
        id: run-cache-key
        run: >-
          echo "run-cache-key=${{ github.run_id }}-${{ github.run_attempt }}-${{
          vars.RANDOM_CACHE_KEY_SUFFIX }}" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  build:
    name: Build
    needs:
      - prBranch
      - constants
    runs-on: webiny-build-packages
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.global-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  npmReleaseBeta:
    needs:
      - prBranch
      - constants
      - build
    name: NPM release ("beta" tag)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      BETA_VERSION: ${{ vars.BETA_VERSION }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/checkout@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}
          ref: ${{ needs.prBranch.outputs.pr-branch }}
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
      - uses: actions/cache@v5
        with:
          path: ${{ needs.prBranch.outputs.pr-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.run-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Create ".npmrc" file in the project root
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Set git username
        run: git config --global user.name "webiny-bot"
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
      - name: Version and publish "beta" tag to NPM
        run: yarn release --type=beta --tag=beta
        working-directory: ${{ needs.prBranch.outputs.pr-branch }}
    runs-on: ubuntu-latest

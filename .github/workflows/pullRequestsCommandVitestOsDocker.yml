name: 💬 PR Command - Vitest (OpenSearch in Docker)
'on': issue_comment
env:
  NODE_OPTIONS: '--max_old_space_size=4096'
  AWS_REGION: eu-central-1
jobs:
  checkComment:
    name: Check comment for /vitest-os-docker
    if: >-
      ${{ github.event.issue.pull_request && (github.event.comment.body ==
      '/vitest-os-docker' || startsWith(github.event.comment.body,
      '/vitest-os-docker ')) }}
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    outputs:
      comment-id: ${{ steps.create-comment.outputs.comment-id }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Check permission and react to comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          PERMISSION=$(gh api "/repos/${{ github.repository }}/collaborators/${{
          github.event.comment.user.login }}/permission" -q .permission)

          if [ "$PERMISSION" != "write" ] && [ "$PERMISSION" != "admin" ]; then
            echo "::error::User ${{ github.event.comment.user.login }} does not have write permission (has: $PERMISSION)."
            exit 1
          fi

          gh api --silent -X POST "/repos/${{ github.repository
          }}/issues/comments/${{ github.event.comment.id }}/reactions" -f
          content=eyes
      - name: Create comment
        id: create-comment
        uses: >-
          peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Vitest tests (DDB+OS, OpenSearch in Docker) have been initiated (for
            more information, click
            [here](https://github.com/webiny/webiny-js/actions/runs/${{
            github.run_id }})). :whale:


            | Group | Status |

            | --- | --- |

            | DDB+OS (Docker) | ⏳ Queued |
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
  baseBranch:
    needs: checkComment
    name: Get base branch
    outputs:
      base-branch: ${{ steps.base-branch.outputs.base-branch }}
      pr-sha: ${{ steps.pr-sha.outputs.pr-sha }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Get base branch
        id: base-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          echo "base-branch=$(gh pr view ${{ github.event.issue.number }} --json
          baseRefName -q .baseRefName)" >> $GITHUB_OUTPUT
      - name: Get PR head SHA
        id: pr-sha
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          echo "pr-sha=$(gh pr view ${{ github.event.issue.number }} --json
          headRefOid -q .headRefOid)" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  constants:
    needs: baseBranch
    name: Create constants
    outputs:
      global-cache-key: ${{ steps.global-cache-key.outputs.global-cache-key }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Create global cache key
        id: global-cache-key
        run: >-
          echo "global-cache-key=${{ needs.baseBranch.outputs.base-branch }}-${{
          runner.os }}-$(/bin/date -u "+%m%d")-${{ vars.RANDOM_CACHE_KEY_SUFFIX
          }}" >> $GITHUB_OUTPUT
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  build:
    name: Build
    needs:
      - baseBranch
      - constants
    runs-on: webiny-build-packages
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: |-
          gh pr checkout ${{ github.event.issue.number }}
          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}/.webiny/cached-packages
          key: ${{ needs.constants.outputs.global-cache-key }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Compress build cache
        run: >-
          tar -cf run-build-cache.tzst --use-compress-program=zstdmt -C
          "${WEBINY_JS_DIR:-.}" .webiny/cached-packages
        env:
          WEBINY_JS_DIR: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Upload build cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: run-build-cache
          path: run-build-cache.tzst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  vitest-os-docker-constants:
    needs:
      - baseBranch
      - build
      - checkComment
    name: Vitest (DDB+OS (Docker)) - Constants
    outputs:
      vitest-test-commands: ${{ steps.list-vitest-test-commands.outputs.vitest-test-commands }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Mark "DDB+OS (Docker)" as running
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
        run: >-
          STATUS="🔄 Running"

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID --jq
          '.body' > /tmp/vitest-comment.txt

          sed -i "s@^| DDB+OS (Docker) |.*@| DDB+OS (Docker) | $STATUS |@"
          /tmp/vitest-comment.txt

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/vitest-comment.txt
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: |-
          gh pr checkout ${{ github.event.issue.number }}
          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - id: list-vitest-test-commands
        name: List Vitest Test Commands
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: >-
          echo "vitest-test-commands=$(node
          .github/workflows/wac/utils/runNodeScripts/listVitestTestCommands.js
          '["ddb-os,ddb"]')" >> "$GITHUB_OUTPUT"
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    permissions:
      contents: read
      actions: write
  vitest-os-docker-run:
    needs:
      - baseBranch
      - constants
      - vitest-os-docker-constants
    name: DDB+OS (Docker) / ${{ matrix.testCommand.title }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node:
          - 24
        testCommand: >-
          ${{
          fromJSON(needs.vitest-os-docker-constants.outputs.vitest-test-commands)
          }}
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      AWS_REGION: eu-central-1
      WEBINY_STORAGE: ddb-os,ddb
      OPENSEARCH_INDEX_PREFIX: ${{ matrix.testCommand.id }}
    services:
      opensearch:
        image: opensearchproject/opensearch:3.3.2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - '9200:9200'
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Checkout Pull Request
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: |-
          gh pr checkout ${{ github.event.issue.number }}
          git checkout --detach ${{ needs.baseBranch.outputs.pr-sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Resolve Yarn cache folder
        id: yarn-cache-folder
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache-folder.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: Download build cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: run-build-cache
      - name: Extract build cache
        run: >-
          tar -xf run-build-cache.tzst --use-compress-program=zstdmt -C
          "${WEBINY_JS_DIR:-.}"
        env:
          WEBINY_JS_DIR: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Install dependencies
        run: yarn --immutable
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Build packages
        run: yarn build
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
      - name: Wait for OpenSearch
        run: >-
          set -euo pipefail


          for i in $(seq 1 60); do
            if curl -sf "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null; then
              echo "OpenSearch is up:"
              curl -s http://localhost:9200
              exit 0
            fi
            sleep 5
          done


          echo "::error::OpenSearch did not answer on localhost:9200 within 5
          minutes."

          exit 1
      - name: Run tests
        run: ${{ matrix.testCommand.cmd }}
        working-directory: ${{ needs.baseBranch.outputs.base-branch }}
    permissions:
      contents: read
      actions: write
  vitest-os-docker-summary:
    name: Vitest (OpenSearch in Docker) status summary
    needs:
      - checkComment
      - vitest-os-docker-run
    if: always() && needs.checkComment.result == 'success'
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      COMMENT_ID: ${{ needs.checkComment.outputs.comment-id }}
      COMMENT_INTRO: >-
        Vitest tests (DDB+OS, OpenSearch in Docker) have been initiated (for
        more information, click
        [here](https://github.com/webiny/webiny-js/actions/runs/${{
        github.run_id }})). :whale:
      RESULT: ${{ needs['vitest-os-docker-run'].result }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Report result
        continue-on-error: true
        run: >-
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{
          github.run_id }}/jobs" --jq '.jobs[] | [.name, .conclusion] | @tsv' >
          /tmp/jobs.tsv


          PREFIX="DDB+OS (Docker) / "

          TOTAL=$(awk -F'\t' -v p="$PREFIX" 'index($1,p)==1{n++} END{print n+0}'
          /tmp/jobs.tsv)

          PASSED=$(awk -F'\t' -v p="$PREFIX" 'index($1,p)==1 &&
          $2=="success"{n++} END{print n+0}' /tmp/jobs.tsv)


          if [ "$TOTAL" -eq 0 ]; then
            case "$RESULT" in
              success) STATUS="✅ Passed" ;;
              cancelled) STATUS="⚪ Cancelled" ;;
              skipped) STATUS="⏭️ Skipped" ;;
              *) STATUS="❌ Failed" ;;
            esac
          elif [ "$PASSED" -eq "$TOTAL" ]; then
            STATUS="✅ $PASSED/$TOTAL passed"
          else
            STATUS="❌ $PASSED/$TOTAL passed"
          fi


          awk -F'\t' -v p="$PREFIX" 'index($1,p)==1 && $2=="failure"{
          x=substr($1,length(p)+1); sub(/^\[[^]]*\] /,"",x); print "- " x }'
          /tmp/jobs.tsv > /tmp/failed.txt


          {
            echo "$COMMENT_INTRO"
            echo ""
            echo "| Group | Status |"
            echo "| --- | --- |"
            echo "| DDB+OS (Docker) | $STATUS |"
            if [ -s /tmp/failed.txt ]; then
              echo ""
              echo "<details><summary>❌ Failed packages</summary>"
              echo ""
              cat /tmp/failed.txt
              echo "</details>"
            fi
          } > /tmp/vitest-comment.txt


          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID -X
          PATCH --field body=@/tmp/vitest-comment.txt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

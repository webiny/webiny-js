name: 🚀 Full Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 6.3.0)
        required: true
        type: string
jobs:
  createDocsBranch:
    name: Trigger release notes generation (docs.webiny.com)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Trigger generate-release-notes workflow
        run: >-
          gh workflow run create-release-branch.yml --repo
          webiny/docs.webiny.com -f version=${{ github.event.inputs.version }}
    runs-on: ubuntu-latest

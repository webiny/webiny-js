name: 🚀 Full Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 6.3.0)
        required: true
        type: string
jobs:
  createWebinyJsBranch:
    name: Create release branch (webiny-js)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Checkout next
        uses: actions/checkout@v5
        with:
          ref: next
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Create and push release branch
        run: >-
          git checkout -b release/${{ github.event.inputs.version }} && git push
          origin release/${{ github.event.inputs.version }}
      - name: Open pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          gh pr create --title "Release ${{ github.event.inputs.version }}"
          --body "Release ${{ github.event.inputs.version }}" --base next --head
          release/${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
  createDocsBranch:
    name: Create release branch + generate changelog (docs.webiny.com)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Checkout docs.webiny.com (master)
        uses: actions/checkout@v5
        with:
          repository: webiny/docs.webiny.com
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Install dependencies
        run: yarn
      - name: Generate changelog
        run: >-
          yarn tsx scripts/generate-changelog.ts --version ${{
          github.event.inputs.version }}
      - name: Create and push release branch
        run: >-
          git checkout -b release/${{ github.event.inputs.version }}

          git add .

          git commit -m "chore: generate changelog for ${{
          github.event.inputs.version }}"

          git push origin release/${{ github.event.inputs.version }}
      - name: Open pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          gh pr create --repo webiny/docs.webiny.com --title "Release ${{
          github.event.inputs.version }}" --body "Release ${{
          github.event.inputs.version }}" --base master --head release/${{
          github.event.inputs.version }}
    runs-on: ubuntu-latest

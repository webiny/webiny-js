name: 🚀 Full Release
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 6.3.0)
        required: true
        type: string
jobs:
  createWebinyJsBranch:
    name: Create release branch (webiny-js)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SLACK_RELEASE_CHANNEL_WEBHOOK: ${{ secrets.SLACK_RELEASE_CHANNEL_WEBHOOK }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Set git email
        run: git config --global user.email "webiny-bot@webiny.com"
      - name: Set git username
        run: git config --global user.name "webiny-bot"
      - name: Checkout next
        uses: actions/checkout@v5
        with:
          ref: next
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Create and push release branch
        run: >-
          git checkout -b release/${{ github.event.inputs.version }} && git
          commit --allow-empty -m "chore: start release ${{
          github.event.inputs.version }}" -m "Empty commit to allow PR
          creation." && git push origin release/${{ github.event.inputs.version
          }}
      - name: Open pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          PR_URL=$(gh pr create --title "📦  Release ${{
          github.event.inputs.version }}" --body "Release ${{
          github.event.inputs.version }}


          **Docs PR:**
          https://github.com/webiny/docs.webiny.com/pulls?q=Release+${{
          github.event.inputs.version }}" --base next --head release/${{
          github.event.inputs.version }}) && echo "pr-url=$PR_URL" >>
          $GITHUB_OUTPUT
      - name: Notify Slack - Release PR Created
        env:
          PR_URL: ${{ steps.pr.outputs.pr-url }}
        run: >-
          MSG="📦 Release PR for Webiny ${{ github.event.inputs.version }} has
          been created: $PR_URL"

          curl -s -o /dev/null -X POST \
            -H "Content-type: application/json" \
            --data "{\"text\":\"${MSG}\"}" \
            "$SLACK_RELEASE_CHANNEL_WEBHOOK"
    runs-on: ubuntu-latest
  createDocsBranch:
    name: Trigger release notes generation (docs.webiny.com)
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Trigger generate-release-notes workflow
        run: >-
          gh workflow run create-release-branch.yml --repo
          webiny/docs.webiny.com -f version=${{ github.event.inputs.version }}
    runs-on: ubuntu-latest

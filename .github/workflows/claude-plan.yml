name: Claude Plan

on:
  issue_comment:
    types: [created]

jobs:
  claude-plan:
    # Trigger only on issue comments (not PR comments) containing "@claude plan"
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude plan')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Check if commenter is authorized
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'maintain', 'write'].includes(perm.permission);
            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${context.payload.comment.user.login} Sorry, only authorized contributors can trigger Claude.`,
              });
              core.setFailed('Unauthorized user');
            }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Claude – Planning
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tell Claude exactly what we want: a structured plan posted as an issue comment.
          # It will read the issue body automatically from context.
          direct_prompt: |
            You are a senior engineer helping plan the implementation of a GitHub issue.

            Read the issue #${{ github.event.issue.number }} titled "${{ github.event.issue.title }}" 
            and its full description. Then produce a clear implementation plan as a GitHub comment 
            on that same issue.

            The plan should include:
            - A short summary of what needs to be done and why
            - A numbered list of implementation steps with enough detail that a developer 
              (or you, in a follow-up run) could execute them without ambiguity
            - Files likely to be created or modified
            - Any edge cases or open questions that should be resolved before work begins
            - A rough estimate of complexity (small / medium / large)

            End the comment with:
            > Once you're happy with this plan, an authorized user can comment `@claude implement` 
            > to start the implementation.

            Post the plan as a comment on issue #${{ github.event.issue.number }}.
          claude_args: >-
            --max-turns 10
          allowed_tools: "Bash(gh issue view:*),Bash(gh issue comment:*)"

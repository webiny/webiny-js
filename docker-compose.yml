# Container deployment POC — Stage 3 of the container refactor.
#
# Boots a hello-world Webiny API in a single container. Future stages will
# add `keycloak` and `mailpit` services and expand the API to talk to SQLite
# + the local-FS file driver.
#
# Prerequisite: build the server bundle first.
#
#   yarn build:server     (alias defined in root package.json)
#
# Then:
#
#   docker compose up api
#
# The API listens on :8080 with /health and /hello routes.

services:
  api:
    build:
      context: ./extensions/api
      dockerfile: Dockerfile
    image: webiny-poc-api:latest
    container_name: webiny-poc-api
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    restart: unless-stopped

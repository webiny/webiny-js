# Webiny container deployment — POC stack.
#
# Quickstart (also documented in detail in
# docs/container-refactor/07-developer-guide.md):
#
#   yarn install
#   yarn build:admin          # builds extensions/admin/build/ (SPA)
#   yarn build:server         # builds extensions/api/build/server.mjs
#   docker compose up
#
#   open http://localhost:8080             # Webiny Admin UI (login via Keycloak)
#
#   # In another terminal:
#   curl http://localhost:8080/health      # → {"status":"ok"}
#   curl http://localhost:8080/tenants     # → root tenant
#   open http://localhost:8180             # Keycloak admin console (admin / admin)
#   open http://localhost:8025             # Mailpit UI
#
# Tear down (preserves volumes):
#   docker compose down
#
# Tear down + wipe state (reset the SQLite DB and uploaded files):
#   docker compose down -v
#
# Services:
#   api      :8080  Webiny API (Fastify long-lived process). /health probe,
#                   /graphql GraphQL endpoint backed by SQLite, JWT validation
#                   against Keycloak. Also serves the prebuilt Admin SPA at /
#                   via @fastify/static (with SPA fallback for deep links).
#   keycloak :8180  OIDC Identity Provider. Realm "webiny" is seeded from
#                   deploy/keycloak/webiny-realm.json with one dev user
#                   (admin@webiny.local / webiny).
#   mailpit  :8025  SMTP catcher. Mailer transport in api points at
#                   mailpit:1025; Mailpit's web UI is on :8025.

services:
  api:
    build:
      context: ./extensions
      dockerfile: api/Dockerfile
    image: webiny-poc-api:latest
    container_name: webiny-poc-api
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # Where the SQLite database lives (mounted volume below).
      SQLITE_FILE: /data/webiny.db
      # File-manager-fs upload directory and the public base URL the
      # api exposes externally — used to construct file URLs in
      # upload payloads.
      FILES_DIR: /data/files
      PUBLIC_BASE_URL: http://localhost:8080
      # Issuer + JWKS used by the Keycloak JWT/OIDC validator. The
      # browser hits Keycloak at http://localhost:8180 (host port-forward),
      # so tokens carry that hostname in the `iss` claim. The api needs
      # to reach Keycloak via Docker DNS, so JWKS_URL points at the
      # in-network address. KEYCLOAK_CLIENT_ID is used as the audience.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/webiny
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/webiny/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: webiny-api
      # SMTP relay (Mailpit captures everything for inspection).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Quiet pino in dev. Set to "debug" or "trace" for more output.
      LOG_LEVEL: info
    volumes:
      - webiny_data:/data
    depends_on:
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    # The Dockerfile already declares a HEALTHCHECK (curl /health) —
    # repeated here only to make the compose-level health visible.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: webiny-poc-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: webiny-poc-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  webiny_data:

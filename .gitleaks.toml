# Custom rules. They cover secret formats the default rules miss (found in the 2026-10 review).

# Postman-style {"key": "...", "value": "..."} pairs. Key name and value are on separate lines.
[[rules]]
id = "json-key-value-secret"
description = "Secret in a JSON {key, value} pair (Postman environment style)"
regex = '''"key"\s*:\s*"[^"]*(?i:secret|password|passwd|token|api_?key|applicationkey|client_?id)[^"]*"\s*,\s*"value"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
entropy = 3.0
keywords = ["\"key\""]

# Database and service URIs with an embedded password.
[[rules]]
id = "connection-string-credentials"
description = "Database or service URI with an embedded password"
regex = '''(?i)\b(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|redis|amqps?)://[^:\s/"']+:([^@\s/"']{6,})@[^\s"']+'''
secretGroup = 1
keywords = ["mongodb", "postgres", "mysql", "mariadb", "redis", "amqp"]

[[rules.allowlists]]
description = "Placeholders such as {YOUR_PASSWORD}, <password> or ${DB_PASSWORD}"
regexes = ['''^\{.*\}$''', '''^<.*>$''', '''^\$\{.*\}$''']

# Hardcoded password property in a config object.
[[rules]]
id = "config-password"
description = "Hardcoded password property in a config object"
regex = '''(?i)\bpassword\s*[:=]\s*["']([^"'\s]{8,})["']'''
secretGroup = 1
entropy = 3.5
keywords = ["password"]

[[rules.allowlists]]
description = "Test files and mocks"
paths = ['''(^|/)__tests__/''', '''(^|/)__mocks__/''', '''\.test\.[cm]?[jt]sx?$''']
